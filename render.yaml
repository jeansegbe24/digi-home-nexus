services:
  # ── Backend FastAPI Service ──────────────────────────────────────────
  - type: web
    name: digihome-backend
    env: python
    plan: free
    rootDir: smart-home-backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # User will provide this from Supabase
      - key: VITE_FRONTEND_URL
        sync: false # User will provide the frontend URL (e.g., https://digihome-frontend.onrender.com)
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: SECRET_KEY
        generateValue: true

  # ── Frontend React/TanStack Service ──────────────────────────────────
  - type: web
    name: digihome-frontend
    env: node
    plan: free
    rootDir: front
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: VITE_API_URL
        sync: false # User will provide the backend URL (e.g., https://digihome-backend.onrender.com)
      - key: NITRO_PRESET
        value: node-server
