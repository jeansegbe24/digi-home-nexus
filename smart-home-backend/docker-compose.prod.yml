version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: digihome-nexus-api:latest
    container_name: digihome_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "com.digihome.service=api"
      - "com.digihome.env=production"

  # Optional: Nginx reverse proxy (uncomment for direct EC2 deployment)
