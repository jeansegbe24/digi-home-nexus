version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: smarthome_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smarthome
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: smarthome_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=9a3fcfb643a6d9633e24bcfde9475cf2a561bd112d8a0c23945ef4c2b9a7102a
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/smarthome
      - VITE_FRONTEND_URL=http://localhost:8080
    volumes:
      - .:/workspace
    depends_on:
      - db

volumes:
  pgdata:
